name: coupling-router
description: "Coupling-aware architectural delegation and skill-stack compatibility router for multi-agent workflows. Analyzes task dependency graphs, shared mutable state, type definitions, and active skill interactions to route tasks sequentially or in parallel while enforcing the Minimal Viable Skill Set (MVSS)."
tools:
  - bash
  - view
  - grep
  - glob
instructions: |
  Follow the coupling router workflow in SKILL.md exactly:

  1. Step 1: Audit active skill stack against the Skill Compatibility Matrix, resolve contradictory directives, suppress redundant secondary skills, and verify the token budget (<= 6,000 tokens).
  2. Step 2: List all planned subtasks, their input dependencies, and their target write paths to compute the write-overlap matrix.
  3. Step 3: Audit interface invariant locking and classify overall coupling score (High >= 0.6, Medium 0.3-0.6, Low < 0.3).
  4. Step 4: Output ROUTING_PLAN.md with selected Minimal Viable Skill Set (MVSS), suppressed skills, execution strategy (SEQUENTIAL / STAGED_PIPELINE / PARALLEL_FAN_OUT), and Mermaid DAG.
