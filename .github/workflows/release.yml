# 🚀 Release Pipeline — muse-skills
#
# Trigger: push of a semver tag (vX.Y.Z)
# Steps: verify → build → create GitHub release (npm publish removed — npx skills add fetches from GitHub)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires a protected `release` environment with required reviewers and a
    # tag protection rule (v*) configured in repository settings.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pr-convention-miner mines commit conventions, and a shallow
          # tag checkout has no history to mine (Release failed on this since v7.1.0).
          fetch-depth: 0

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Validate release tag and main ancestry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release tag must be vMAJOR.MINOR.PATCH: $TAG_NAME"; exit 1;
          }
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          echo "Tag ${TAG_NAME} is on main"

      - name: Install dependencies
        run: bun install

      - name: Verify tests pass
        run: bun test

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Publish the curated section for this version, not just auto-generated
      # PR titles. The section runs from its "# ... Muse Skills vX.Y.Z" heading
      # to the next version heading.
      - name: Extract release notes for this version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="v${VERSION}" '
            /^# / && /Muse Skills / {
              if (capturing) exit
              if (index($0, "Muse Skills " ver " ")) capturing = 1
            }
            capturing { lines[++n] = $0 }
            END {
              while (n > 0 && (lines[n] == "" || lines[n] == "---")) n--
              for (i = 1; i <= n; i++) print lines[i]
            }
          ' RELEASE_NOTES.md > release-body.md
          if [ ! -s release-body.md ]; then
            printf '## muse-skills v%s\n\nSee [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "$VERSION" "$GITHUB_REPOSITORY" > release-body.md
          fi
          echo "Release notes bytes: $(wc -c < release-body.md)"

      - name: Generate checksums for the installer pin
        run: |
          set -euo pipefail
          printf '%s  source-commit\n' "$(git rev-parse HEAD)" > checksums.txt
          sha256sum scripts/install.sh | awk '{ print $1 "  install.sh" }' >> checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: "muse-skills v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release (smoke)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:smoke
