# 🚀 Release Pipeline — muse-skills
#
# Trigger: push of a semver tag (vX.Y.Z)
# Steps: verify → build → create GitHub release (npm publish removed — npx skills add fetches from GitHub)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pr-convention-miner mines commit conventions, and a shallow
          # tag checkout has no history to mine (Release failed on this since v7.1.0).
          fetch-depth: 0

      - name: Restore cached Bun runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/bin/bun
          key: bun-${{ runner.os }}-1.4.4

      - id: bun-runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        continue-on-error: true
        with:
          bun-version: 1.4.4

      # GitHub's release-asset CDN intermittently answers 504 on the first
      # download. A pinned version plus a warm ~/.bun/bin/bun cache makes setup-bun
      # reuse the existing binary and skip the CDN; the retry below covers a
      # genuine cold-start failure.
      - name: Setup Bun (retry after CDN 504)
        if: steps.bun-runtime.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Verify tests pass
        run: bun test

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Publish the curated section for this version, not just auto-generated
      # PR titles. The section runs from its "# ... Muse Skills vX.Y.Z" heading
      # to the next version heading.
      - name: Extract release notes for this version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="v${VERSION}" '
            /^# / && /Muse Skills / {
              if (capturing) exit
              if (index($0, "Muse Skills " ver " ")) capturing = 1
            }
            capturing { lines[++n] = $0 }
            END {
              while (n > 0 && (lines[n] == "" || lines[n] == "---")) n--
              for (i = 1; i <= n; i++) print lines[i]
            }
          ' RELEASE_NOTES.md > release-body.md
          if [ ! -s release-body.md ]; then
            printf '## muse-skills v%s\n\nSee [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "$VERSION" "$GITHUB_REPOSITORY" > release-body.md
          fi
          echo "Release notes bytes: $(wc -c < release-body.md)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: "muse-skills v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
