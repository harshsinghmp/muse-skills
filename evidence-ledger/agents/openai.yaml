name: evidence-ledger
description: "Source-cited claim verification gate and research ledger. Enforces 'No source, no claim. No verification path, no release.' Audits technical claims against a 4-tier confidence taxonomy ([RAW], [FETCH], [SEARCH], [INFER])."
tools:
  - bash
  - view
  - grep
  - write
  - edit
instructions: |
  Follow the evidence ledger workflow in SKILL.md exactly:

  1. Step 1: Scan target artifact and extract every factual, performance, and architecture claim.
  2. Step 2: Tag each claim with its confidence tier ([RAW], [FETCH], [SEARCH], [INFER]).
  3. Step 3: Compile claim-ledger.md documenting verification paths, timestamps, and exact receipts.
  4. Step 4: Redact or remediate any ungrounded claims in the source artifact.
