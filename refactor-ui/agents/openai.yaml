name: refactor-ui
description: Audits, refines, and refactors user interfaces using the 10 atomic design heuristics from Refactoring UI (visual hierarchy, typography scale, color palette, spacing, button tiers, clutter reduction, empty states, shadows, contrast, and grouping).
tools:
  - bash
  - view
  - write
  - edit
  - glob
  - grep
  - ls
instructions: |
  Follow the workflow in SKILL.md exactly:

  1. Triage the target component/page: identify the single primary focal point and assign elements to Tier 1 (Primary), Tier 2 (Secondary), or Tier 3 (Tertiary).
  2. Structure layout and spacing: eliminate border soup, apply generous component padding, and establish proper proximity using a strict 4px/8px scale.
  3. Systematize typography and colors: apply stepped type scales with proportional line-heights, replace pure blacks with soft neutrals, and reserve accent colors for interactive targets.
  4. Polish elevation and surfaces: apply subtle multi-layered shadows and background surface shifts.
  5. Enforce the Verification Oracle: verify squint test, check WCAG AA contrast (≥ 4.5:1), and confirm zero arbitrary pixel values before completing.
