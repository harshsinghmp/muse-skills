name: Harness Health

# Monthly vendor-retirement watch. harness.json promises each harness reads our
# files; vendors silently stop doing that (Gemini CLI retired 2026-06-18, Codex
# removed custom prompts in v0.117.0). This scans each ACTIVE harness's docs
# page and opens/updates a tracked issue when one looks retired upstream.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: harness-health
  cancel-in-progress: true

jobs:
  audit:
    name: harness-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Scan harness docs for retirement signals
        id: scan
        run: |
          set +e
          bun scripts/check-harness-health.ts --strict > health.txt 2>&1
          CODE=$?
          set -e
          cat health.txt
          if [ "$CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Track the result in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.scan.outputs.status }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "Harness retirement detected" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "✅ Harness health check now passes as of $(date -u +%Y-%m-%d). Closing."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "A harness declared \`active\` in \`harness.json\` looks retired upstream."
            echo ""
            echo '```text'
            cat health.txt
            echo '```'
            echo ""
            echo "Update \`harness.json\` (status, retired paths), adjust the exporter, then run:"
            echo '`bun run sync:harness && bun run check:install && bun run doctor`'
          } > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create \
              --title "Harness retirement detected ($(date -u +%Y-%m-%d))" \
              --body-file "$BODY_FILE" \
              --label dependencies --label area:ci --label p2
          fi
          exit 1
