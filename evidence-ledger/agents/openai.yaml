name: evidence-ledger
description: "Source-cited claim verification gate, academic citation synthesizer, and research ledger. Enforces 'No source, no claim. No verification path, no release.' Audits technical claims against a 4-tier confidence taxonomy ([RAW], [FETCH], [SEARCH], [INFER]), DOI receipts, and empirical vs speculative classification."
tools:
  - bash
  - view
  - grep
  - write
  - edit
instructions: |
  Follow the evidence ledger workflow in SKILL.md exactly:

  1. Step 1: Scan target artifact and extract every factual, performance, and architecture claim.
  2. Step 2: Tag each claim with its confidence tier ([RAW], [FETCH], [SEARCH], [INFER]) and verify academic DOI / canonical URLs per references/academic-citation-protocol.md.
  3. Step 3: Classify each claim as [EMPIRICAL] or [SPECULATIVE].
  4. Step 4: Scan statistical claims (percentages, multipliers) and emit MISSING_RECEIPTS_REPORT.md for any unbacked claims.
  5. Step 5: Compile claim-ledger.md documenting verification paths, timestamps, and exact receipts.
  6. Step 6: Redact or remediate any ungrounded claims in the source artifact.
