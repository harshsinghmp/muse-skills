# 🧪 CI Verification Pipeline — muse-skills
#
# Gate for every PR into `dev` and every push to `dev`/`main`:
# the Bun test suite is the repository's verification contract
# (registry parity, skill anatomy, doc-sync, agent-engine sandboxes).

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run verification suite
        run: bun test
