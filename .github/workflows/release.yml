# 🚀 Release Pipeline — muse-skills
#
# Trigger: push of a semver tag (vX.Y.Z)
# Steps: verify → build → create GitHub release (npm publish removed — npx skills add fetches from GitHub)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pr-convention-miner mines commit conventions, and a shallow
          # tag checkout has no history to mine (Release failed on this since v7.1.0).
          fetch-depth: 0

      - name: Restore cached Bun runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/bin/bun
          key: bun-${{ runner.os }}-1.4.4

      - id: bun-runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        continue-on-error: true
        with:
          bun-version: 1.4.4

      # GitHub's release-asset CDN intermittently answers 504 on the first
      # download. A pinned version plus a warm ~/.bun/bin/bun cache makes setup-bun
      # reuse the existing binary and skip the CDN; the retry below covers a
      # genuine cold-start failure.
      - name: Setup Bun (retry after CDN 504)
        if: steps.bun-runtime.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Verify tests pass
        run: bun test

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: "muse-skills v${{ steps.version.outputs.VERSION }}"
          body: |
            ## muse-skills v${{ steps.version.outputs.VERSION }}

            ### Installation
            \`\`\`bash
            npx skills add harshsinghmp/muse-skills
            \`\`\`

            ### What's new in this release
            See [CHANGELOG.md](https://github.com/harshsinghmp/muse-skills/blob/main/CHANGELOG.md)

            ### Release verification
            - [x] bun test → green
            - [x] secret scan → clean
            - [x] registry parity → 0 mismatches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
