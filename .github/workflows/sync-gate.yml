name: Sync Gate

# Blocks a PR whose head does not contain the latest base branch.
# This is the server-side half of the pre-merge sync discipline; the local
# half is `bun run check:sync`. Make this check required on `dev` and `main`
# together with "Require branches to be up to date before merging".

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  sync-gate:
    name: sync-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Fork-safe: refs/pull/<n>/head exists in the base repository for forks too.
      - name: Fetch the PR head and base commits
        env:
          PR_NUMBER: ${{ github.event.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          test -n "$BASE_REF"
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:pr-head" --force
          git fetch --no-tags origin "${BASE_REF}:base-ref" --force

      - name: Verify the branch contains the latest base (gate from base ref)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Run the gate from the base ref, not the PR checkout: a PR must not be
          # able to neuter the script that judges it.
          git worktree add --detach gate-base base-ref >/dev/null
          ( cd gate-base && bun scripts/check-sync.ts --base="${BASE_REF}" --head=pr-head --no-local-base --no-fetch )
