name: updateagents
description: Synchronizes AI-agent instructions and project context with the actual workspace state. Retrofits DOX architecture, syncs standards from new-project/templates, and strictly enforces the MuseMemory boundary.
tools:
  - bash
  - view
  - write
  - edit
  - glob
  - grep
  - ls
instructions: |
  Follow the 17-step workflow in SKILL.md exactly. Key steps:
  
  1. Scope: Current directory only. HARD BOUNDARY: NEVER touch, read, or modify .memory/**.
  2. Discover: Discover existing instruction files (AGENTS.md, CLAUDE.md, .cursorrules).
  3. Inspect: Inspect canonical sources (package.json, build configs, git diff).
  4. Context Delta: Identify NEW, CHANGED, and OBSOLETE knowledge.
  5. DOX Retrofit: If DOX is missing, scaffold 9-folder container and migrate facts to .agents/context/.
  6. Standards Sync: Sync .agents/standards/ and brand tokens from new-project/templates/.
  7. Validate: Verify size <5KB, commands match package.json, and .memory/** was untouched.
  8. Report: Return concise structured summary of updates.
