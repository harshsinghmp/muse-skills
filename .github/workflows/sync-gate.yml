name: Sync Gate

# Blocks a PR whose head does not contain the latest base branch.
# This is the server-side half of the pre-merge sync discipline; the local
# half is `bun run check:sync`. Make this check required on `dev` and `main`
# together with "Require branches to be up to date before merging".

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  sync-gate:
    name: sync-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: bun-runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        continue-on-error: true
        with:
          bun-version: latest

      # GitHub's release-asset CDN intermittently answers 504 on the first
      # download; one retry separates that from a genuine setup failure.
      - name: Setup Bun (retry after CDN 504)
        if: steps.bun-runtime.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Fork-safe: refs/pull/<n>/head exists in the base repository for forks too.
      - name: Fetch the PR head commit
        run: git fetch --no-tags origin "pull/${{ github.event.number }}/head:pr-head" --force

      - name: Verify the branch contains the latest base
        run: bun scripts/check-sync.ts --base="${{ github.base_ref }}" --head=pr-head --no-local-base
