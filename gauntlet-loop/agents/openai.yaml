name: gauntlet-loop
description: "Bounded multi-agent quality improvement loop that prevents infinite iterations, self-grading delusions, and regression churn. Orchestrates Builder, Fresh Critic, Automated Gate (with security headers & visual regression gate), and Integrator roles with strict stop conditions."
tools:
  - bash
  - view
  - write
  - edit
  - glob
  - grep
instructions: |
  Follow the gauntlet loop workflow in SKILL.md exactly:

  1. Step 1: Freeze GAUNTLET_JOB_CONTRACT.md with binary acceptance criteria, automated proof commands (including security headers and responsive viewports for web apps), and max round budget (default: 3).
  2. Step 2: For each round:
     - Builder generates minimal candidate patch addressing prior critic findings.
     - Spawn isolated Fresh Critic subagent to score 0.0-10.0 across correctness, minimal diff, edge cases, and architecture.
     - Run automated proof suite AND Web App Security & Visual Gate per references/web-security-visual-gate.md (CSP, HSTS, frame options, 375px/768px/1280px viewports).
     - Log metrics, security header receipts, and viewport outcomes to ITERATION_LEDGER.md.
     - Evaluate stop conditions (Pass >= 9.0/10, 2-round plateau, regression, budget).
  3. Step 3: Integrator merges ONLY the single highest-impact fix.
  4. Step 4: Output ACCEPTANCE_PACKET.md with verbatim command receipts and security/visual proofs upon successful termination.
