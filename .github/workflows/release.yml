# 🚀 Release Pipeline — muse-skills
#
# Trigger: push of a semver tag (vX.Y.Z)
# Steps: verify → build → create GitHub release (npm publish removed — npx skills add fetches from GitHub)

name: Release

on:
  push:
    tags:
      - "v*"
  # Repair path: a workflow bug inside a tag cannot be fixed by re-running it
  # (GitHub runs the file from the tag). Dispatching runs THIS file from the
  # default branch, so a fix never requires moving a published tag. With no
  # input it targets the LATEST release; required checks must already be green
  # for that commit, so assets are never attached to unverified code.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets for (default: latest release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires a protected `release` environment with required reviewers and a
    # tag protection rule (v*) configured in repository settings.
    environment: release
    steps:
      - name: Resolve target tag
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then TAG="$REF_NAME"; fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release tag must be vMAJOR.MINOR.PATCH: $TAG"; exit 1;
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          # Full history: pr-convention-miner mines commit conventions, and a shallow
          # tag checkout has no history to mine (Release failed on this since v7.1.0).
          fetch-depth: 0

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Validate release tag and main ancestry
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release tag must be vMAJOR.MINOR.PATCH: $TAG_NAME"; exit 1;
          }
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          echo "Tag ${TAG_NAME} is on main"

      - name: Install dependencies
        run: bun install

      - name: Verify docs ledger is current
        run: bun run check:ledger

      - name: Verify tests pass
        # Match CI: the default 5s cap is too tight for the routing benchmarks
        # on a cold runner, and a timeout there blocks the release assets.
        run: bun test --parallel --timeout 30000

      # A dispatch run never re-tests: it asserts the tag's commit already passed
      # the required checks, then attaches assets.
      - name: Verify required checks are green for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 20); do
            JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
            BAD="$(printf '%s' "$JSON" | jq '[.check_runs[] | select(.name != "release") | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')"
            if [ "$BAD" -ne 0 ]; then echo "Required checks failed for ${SHA}"; exit 1; fi
            MISSING=""
            for name in lint type-check "bun test" routing-matrix secret-scan security-audit; do
              printf '%s' "$JSON" | jq -e --arg n "$name" '.check_runs[] | select(.name == $n and .status == "completed" and .conclusion == "success")' >/dev/null || MISSING="$MISSING $name"
            done
            if [ -z "$MISSING" ]; then echo "All required checks green for ${SHA}"; exit 0; fi
            echo "Waiting on:$MISSING"; sleep 15
          done
          echo "Timed out waiting for green checks"; exit 1

      - name: Get version from tag
        id: version
        run: echo "VERSION=${{ steps.target.outputs.version }}" >> $GITHUB_OUTPUT

      # Publish the curated section for this version, not just auto-generated
      # PR titles. The section runs from its "# ... Muse Skills vX.Y.Z" heading
      # to the next version heading.
      - name: Extract release notes for this version
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          awk -v ver="v${VERSION}" '
            /^# / && /Muse Skills / {
              if (capturing) exit
              if (index($0, "Muse Skills " ver " ")) capturing = 1
            }
            capturing { lines[++n] = $0 }
            END {
              while (n > 0 && (lines[n] == "" || lines[n] == "---")) n--
              for (i = 1; i <= n; i++) print lines[i]
            }
          ' RELEASE_NOTES.md > release-body.md
          if [ ! -s release-body.md ]; then
            printf '## muse-skills v%s\n\nSee [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "$VERSION" "$GITHUB_REPOSITORY" > release-body.md
          fi
          echo "Release notes bytes: $(wc -c < release-body.md)"

      - name: Generate checksums for the installer pin
        run: |
          set -euo pipefail
          printf '%s  source-commit\n' "$(git rev-parse HEAD)" > checksums.txt
          sha256sum scripts/install.sh | awk '{ print $1 "  install.sh" }' >> checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.target.outputs.tag }}
          name: "muse-skills v${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release (smoke)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: bun run release:smoke
