# agent-dirs.conf — harness detection table
# Format: dir_name:hook_install_subdir:config_format
# config_format: native (no config, just files) | yaml | json | config (manual)
#
# The install script reads this file to know where to place hooks and what
# registration each harness needs. Kept separate so hook logic never hardcodes
# harness directory names.

.git:hooks:native
.claude:hooks:json
.codex:hooks:native
.opencode:hooks:yaml
.gemini:hooks:yaml
.cursor:hooks:native
.windsurf:hooks:native
.aider:hooks:native
.cline:hooks:native
.trae:hooks:native
.continue:hooks:json
.omo:hooks:native
.crush:hooks:native
.antigravity:hooks:native