# 🚀 Release Pipeline — muse-skills
#
# Trigger: push of a semver tag (vX.Y.Z)
# Steps: verify → build → publish to npm → create GitHub release

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify tests pass
        run: bun test

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to npm (optional)
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          name: "muse-skills v${{ steps.version.outputs.VERSION }}"
          body: |
            ## muse-skills v${{ steps.version.outputs.VERSION }}

            ### Installation
            \`\`\`bash
            npx skills add harshsinghmp/muse-skills
            \`\`\`

            ### What's new in this release
            See [CHANGELOG.md](https://github.com/harshsinghmp/muse-skills/blob/main/CHANGELOG.md)

            ### Release verification
            - [x] bun test → green
            - [x] secret scan → clean
            - [x] registry parity → 0 mismatches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
