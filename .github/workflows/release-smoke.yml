name: Release Smoke

# Verifies a published release: tag, checksum asset, installer pin.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Verify the release and installer checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:smoke
