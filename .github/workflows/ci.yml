# 🧪 CI Verification Pipeline — muse-skills
#
# Gate for every PR into `dev` and every push to `dev`/`main`:
# test → secret-scan
#
# The Bun test suite is the repository's verification contract
# (registry parity, skill anatomy, doc-sync, agent-engine sandboxes).

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Supersede in-flight runs on force-push / rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun package tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: One authoritative lockfile
        run: |
          set -euo pipefail
          test -f bun.lock
          if [ -f package-lock.json ] || [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "Only bun.lock may exist; remove the extra lockfile." >&2
            exit 1
          fi

      - name: Validate .mcp.json allowlist
        run: bun run check:mcp

      - name: Check skill discovery surfaces
        run: bun run check:surface

      - name: Dependency smoke gate
        run: bun run check:deps

      - name: Install uv (ruff runner)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Lint (biome + ruff)
        run: bun run lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun package tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bun run type-check

  # The cache cleaner is the one skill whose behaviour depends on the host
  # shell and filesystem tooling: GNU vs BSD find/stat on macOS, and the
  # batch + PowerShell discovery path on Windows. The Ubuntu suite cannot
  # exercise either, so run the real thing on both runners.
  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # BSD find/stat fallback, symlink handling, matcher corroboration,
      # newest-file dormancy, risk gating, and whole-directory deletion.
      - name: Cleaner suite (macOS / BSD tools)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash -n skills/reflection-maintenance/clean-system-cache/scripts/clean-cache.sh
          bun test tests/clean-system-cache.test.ts

      # End-to-end Windows path: the PowerShell discovery helper (matchers,
      # newest-file dormancy, claim revalidation) and the batch wrapper.
      - name: Cleaner smoke (Windows / batch + PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "clean-cache-smoke"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          $projects = Join-Path $root "projects"
          $target = Join-Path $projects "app\target"
          $maven = Join-Path $projects "maven\target"
          $venv = Join-Path $projects "pyok\.venv"
          $fresh = Join-Path $projects "fresh\target"

          New-Item -ItemType Directory -Force -Path (Join-Path $target "debug") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $maven "classes") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $venv "lib") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $fresh "debug") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $projects "linked") | Out-Null
          Set-Content -LiteralPath (Join-Path $projects "app\Cargo.toml") -Value "[package]`nname = `"app`""
          Set-Content -LiteralPath (Join-Path $projects "fresh\Cargo.toml") -Value "[package]`nname = `"fresh`""
          Set-Content -LiteralPath (Join-Path $projects "linked\Cargo.toml") -Value "[package]`nname = `"linked`""
          Set-Content -LiteralPath (Join-Path $target "debug\app.exe") -Value ("x" * 4096)
          Set-Content -LiteralPath (Join-Path $maven "classes\A.class") -Value ("x" * 4096)
          Set-Content -LiteralPath (Join-Path $venv "lib\a.py") -Value ("x" * 4096)
          Set-Content -LiteralPath (Join-Path $venv "pyvenv.cfg") -Value "home=C:\Python"
          Set-Content -LiteralPath (Join-Path $fresh "debug\new.exe") -Value ("x" * 4096)

          $old = (Get-Date).AddDays(-40)
          Get-ChildItem -LiteralPath $projects -Recurse -Force | ForEach-Object { $_.LastWriteTime = $old }
          (Get-Item -LiteralPath $projects).LastWriteTime = $old
          # The fresh artifact keeps a new file inside an old directory.
          (Get-Item -LiteralPath (Join-Path $fresh "debug\new.exe")).LastWriteTime = Get-Date
          # A junction named target/ with a sibling Cargo.toml must never be
          # treated as a Rust artifact, and discovery must not descend into it.
          $linked = Join-Path $projects "linked\target"
          New-Item -ItemType Junction -Path $linked -Target $target | Out-Null
          if (-not (Test-Path -LiteralPath $linked)) { throw "junction was not created" }

          $discover = "skills\reflection-maintenance\clean-system-cache\scripts\discover-projects.ps1"
          $text = (& powershell -NoProfile -ExecutionPolicy Bypass -File $discover -Roots $projects -DormantDays 14 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "discover-projects.ps1 failed" }
          if (-not $text.Contains($target)) { throw "Rust target not discovered: $text" }
          if (-not $text.Contains($venv)) { throw "Python venv not discovered: $text" }
          if ($text.Contains($maven)) { throw "Maven target wrongly discovered: $text" }
          if ($text.Contains($fresh)) { throw "fresh target wrongly discovered: $text" }
          if ($text.Contains($linked)) { throw "junction target wrongly discovered: $text" }

          & powershell -NoProfile -ExecutionPolicy Bypass -File $discover -Claim $target -DormantDays 14
          if ($LASTEXITCODE -ne 0) { throw "claim rejected the valid Rust target" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $discover -Claim $maven -DormantDays 14
          if ($LASTEXITCODE -eq 0) { throw "claim accepted a Maven target" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File $discover -Claim $linked -DormantDays 14
          if ($LASTEXITCODE -eq 0) { throw "claim accepted a junction" }

          $stateRoot = Join-Path $root "state"
          $stateDir = Join-Path $stateRoot "clean-system-cache"
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          Set-Content -LiteralPath (Join-Path $stateDir "config.txt") -Value "PROJECT_ROOTS=$projects`nDORMANT_DAYS=14"
          $env:LOCALAPPDATA = $stateRoot

          $cmd = "skills\reflection-maintenance\clean-system-cache\scripts\clean-cache.cmd"
          & cmd /c "$cmd /discover"
          if ($LASTEXITCODE -ne 0) { throw "/discover failed" }
          $discovered = Get-Content -Raw (Join-Path $stateDir "discovered.txt")
          if (-not $discovered.Contains($target)) { throw "/discover did not list the Rust target" }

          $onlyOut = & cmd /c "$cmd /only proj:$target /yes" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "discovered.txt:"
            Get-Content -LiteralPath (Join-Path $stateDir "discovered.txt")
            throw "/only failed: $onlyOut"
          }
          if (Test-Path -LiteralPath $target) { throw "target directory was not removed" }
          if (-not (Test-Path -LiteralPath (Join-Path $projects "app\Cargo.toml"))) { throw "Cargo.toml was removed" }

          # The purge/status branch for ASK! TEMP: clear contents, keep the dir.
          $localTemp = Join-Path $stateRoot "Temp"
          New-Item -ItemType Directory -Force -Path (Join-Path $localTemp "nested") | Out-Null
          Set-Content -LiteralPath (Join-Path $localTemp "loose.tmp") -Value ("x" * 4096)
          Set-Content -LiteralPath (Join-Path $localTemp "nested\inner.tmp") -Value ("x" * 4096)
          $tempOut = & cmd /c "$cmd /only win-temp /yes /confirm-irreversible" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "win-temp purge failed: $tempOut" }
          if (-not (Test-Path -LiteralPath $localTemp)) { throw "win-temp removed the TEMP directory instead of its contents" }
          if (Test-Path -LiteralPath (Join-Path $localTemp "loose.tmp")) { throw "win-temp left a file behind: $tempOut" }
          if (Test-Path -LiteralPath (Join-Path $localTemp "nested")) { throw "win-temp left a subdirectory behind: $tempOut" }

          Write-Host "Windows clean-system-cache smoke passed"

  test:
    name: bun test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: pr-convention-miner test analyzes recent commits and
          # fails on shallow PR merge refs (single non-conventional merge commit).
          fetch-depth: 0

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Run verification suite
        run: bun test --parallel --timeout 30000

      - name: Harness hygiene public-surface gate
        run: bun run check:hygiene

  routing-matrix:
    name: routing-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun package tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every distribution at once: a routing change that improves one set while
      # lowering another fails here, not in a reviewer's memory.
      - name: Routing matrix (tuned + every blind set)
        run: bun run check:routing:matrix

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Audit-gate options (additive; defaults preserve existing gate).
    # Pattern: runkids/skillshare `audit` flags (MIT, pattern-only).
    env:
      AUDIT_THRESHOLD: low # critical|high|medium|low (informational; gate still fails on any match)
      AUDIT_FORMAT: text # text|json|sarif (sarif/json write files; text behavior unchanged)
      AUDIT_RULES_FILE: "" # e.g. scripts/hooks/audit-rules.example.yaml
      AUDIT_OUTPUT: "" # e.g. skillshare-audit.sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret scan (git grep, free)
        id: secret-scan
        run: |
          # Free community secret patterns — same coverage as gitleaks basic config.
          # git grep is a git dependency: unlike rg it is always present, searches
          # tracked dotfiles, and never reports a "clean" result when the scanner
          # itself is missing.
          PATTERN="sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{30,}|glpat-[a-zA-Z0-9-]{20,}|-----BEGIN (RSA|OPENSSH|PGP) PRIVATE KEY-----|aws_secret_access_key[[:space:]]*[:=]|GOOGLE_API_KEY[[:space:]]*[:=]"
          if [ -n "${AUDIT_RULES_FILE:-}" ] && [ -f "${AUDIT_RULES_FILE:-}" ]; then
            EXTRA="$(grep -v '^#' "$AUDIT_RULES_FILE" | grep -v '^$' | grep -v '^threshold:' | grep -v '^format:' | grep -v '^patterns:' | sed 's/^[[:space:]]*-[[:space:]]*//;s/^"//;s/"$//' | paste -sd'|' - || true)"
            [ -n "$EXTRA" ] && PATTERN="$PATTERN|$EXTRA"
          fi
          echo "threshold: ${AUDIT_THRESHOLD:-low} (documented; gate fails on any match)"
          TMP="$(mktemp)"
          set +e
          git grep -nEI "$PATTERN" -- . > "$TMP" 2>/dev/null
          GREP_STATUS=$?
          set -e
          if [ "$GREP_STATUS" -gt 1 ]; then
            echo "Secret scanner failed (git grep exit $GREP_STATUS) — failing closed"
            exit 2
          fi

          COUNT=$(wc -l < "$TMP" | tr -d ' ')
          OUT="${AUDIT_OUTPUT:-}"
          case "${AUDIT_FORMAT:-text}" in
            json)
              [ -n "$OUT" ] || OUT="secret-scan.json"
              node - "$TMP" "$OUT" "$COUNT" <<'NODE'
          const fs = require("node:fs");
          const [src, dst, count] = process.argv.slice(2);
          const locations = fs.readFileSync(src, "utf8").split("\n").filter(Boolean)
            .map((line) => line.match(/^(.+?):(\d+):/)).filter(Boolean)
            .map((m) => `${m[1]}:${m[2]}`);
          fs.writeFileSync(dst, JSON.stringify({
            tool: "ci-secret-scan", threshold: process.env.AUDIT_THRESHOLD || "low",
            count: Number(count), locations,
          }, null, 2));
          NODE
              ;;
            sarif)
              [ -n "$OUT" ] || OUT="secret-scan.sarif"
              node - "$TMP" "$OUT" <<'NODE'
          const fs = require("node:fs");
          const [src, dst] = process.argv.slice(2);
          const results = fs.readFileSync(src, "utf8").split("\n").filter(Boolean)
            .map((line) => line.match(/^(.+?):(\d+):/)).filter(Boolean)
            .map((m) => ({
              ruleId: "credential-leak",
              level: "error",
              message: { text: "Potential credential detected" },
              locations: [{ physicalLocation: {
                artifactLocation: { uri: m[1] },
                region: { startLine: Number(m[2]) },
              } }],
            }));
          fs.writeFileSync(dst, JSON.stringify({
            $schema: "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            version: "2.1.0",
            runs: [{ tool: { driver: { name: "ci-secret-scan", rules: [{ id: "credential-leak" }] } }, results }],
          }, null, 2));
          NODE
              ;;
          esac
          echo "output=${OUT}" >> "$GITHUB_OUTPUT"
          echo "report=${OUT}" >> "$GITHUB_OUTPUT"

          if [ "$GREP_STATUS" -eq 0 ]; then
            # Locations only. Never print the matched line: it contains the secret.
            echo "Potential secrets found. Locations:"
            sed -E 's/^([^:]+:[0-9]+):.*/  - \1/' "$TMP" | head -50
            echo "Potential secrets found — review the report and rotate the credentials."
            exit 1
          fi
          echo "Secret scan clean"

      - name: Upload SARIF (opt-in, fails closed)
        if: always() && env.AUDIT_FORMAT == 'sarif'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.secret-scan.outputs.report || 'secret-scan.sarif' }}
          category: secret-scan

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Boundary and tenant isolation audit
        run: bun skills/quality-review/muse-security/scripts/boundary-audit.ts -p .

      - name: Lifecycle and lockfile supply-chain audit
        run: |
          bun skills/quality-review/code-review/scripts/code-review.ts --audit-edr-safety .
          bun skills/quality-review/code-review/scripts/code-review.ts --audit-lockfile .

  landing-gate:
    name: landing-gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, routing-matrix, secret-scan, security-audit]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail closed: no cached executable under a static key and no
      # continue-on-error. The install must succeed from the pinned version.
      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Pre-review gate: only on pull requests. Resolve by PR number, not the
      # head branch name (ambiguous across forks).
      - name: Pre-review gate (pull_request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun run check:landed -- --mode=pre-review --pr="$PR_NUMBER"

      # Post-merge gate: only on push to the integration branch (against github.ref_name).
      - name: Post-merge gate (push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: bun run check:landed -- --mode=post-merge --branch="$TARGET_BRANCH"
