# 🤖 Dependency Automation (default scaffold)
#
# Monitors the repository's package ecosystems for vulnerabilities and updates.
# Adjust ecosystems, schedule, and limits to match this project's stack.
version: 2
updates:
  # Dependabot defaults to the default branch (main). This repository lands
  # changes on dev first (dev → release/vX.Y.Z → main), so every update PR must
  # target dev; otherwise a dependency bump bypasses the release train.
  #
  # Bun is the authoritative lockfile (bun.lock). Do not reintroduce npm.
  - package-ecosystem: "bun"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by repository workflows
  - package-ecosystem: "github-actions"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Add ecosystem blocks (pip, cargo, go-modules, composer, etc.) as needed.
